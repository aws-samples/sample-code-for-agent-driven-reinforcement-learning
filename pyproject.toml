[project]
name = "autonomous-rl"
version = "0.1.0"
description = "Agents that train themselves: autonomous RL on AWS"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gymnasium>=1.3,<2.0",
    "box2d==2.3.10",
    "pygame-ce>=2.1.3",
    "stable-baselines3>=2.9,<3.0",
    "numpy>=2.0,<3.0",
    "pillow>=10,<13",
    "matplotlib>=3.8,<4.0",
    "strands-harness>=0.5.0,<0.6.0",
    "aws-bedrock-token-generator>=1.1,<2.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.1,<2.0",
    "ipykernel>=6.29,<8.0",
    "nbformat>=5.10,<6.0",
]
dev = [
    "ruff>=0.6,<1.0",
    "pytest>=8,<9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["rl*", "agent*"]

[tool.ruff.lint.per-file-ignores]
# Names defined by %run in the notebook.
"*.ipynb" = ["F821"]
